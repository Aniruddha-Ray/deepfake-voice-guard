name: release

# Continuous delivery: pushing a version tag (for example v1.0.0) publishes the CPU image to GitHub Container Registry as
#   ghcr.io/<owner>/deepfake-voice-guard:<version> and :latest
# The model weights are not in the image: mount them at /models (see deploy/docker-compose.yml).
# Nothing is deployed to a cluster or a server from here; that needs a target that exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/deepfake-voice-guard" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Validate the compose files
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml config -q
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t "$IMAGE:candidate" .
      - name: Smoke-test the image
        run: docker run --rm "$IMAGE:candidate" python -m audiodf --help
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE:candidate" "$IMAGE:$version"
          docker tag "$IMAGE:candidate" "$IMAGE:latest"
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
